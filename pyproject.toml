[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kernelagent"
version = "0.1.0"
description = "An LLM/agent loop that optimizes compute kernels from real compiler and profiler feedback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KernelAgent authors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "triton>=2.2"]
llm = ["anthropic>=0.30", "openai>=1.30"]
dev = [
  "pytest>=7.4",
  "pytest-timeout>=2.2",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
kernelagent = "kernelagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["kernelagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true
