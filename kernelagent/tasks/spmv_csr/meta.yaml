name: spmv_csr
description: Sparse matrix-vector product y = A x on a fixed-pattern CSR matrix.
character: memory-bound
kernel: kernel.cpp
shapes:
  small: {M: 20000, N: 20000, NNZ: 8}
  large: {M: 200000, N: 200000, NNZ: 8}
knobs:
  ACCUMULATORS: {kind: int, values: [1, 2, 4], doc: independent partial sums per row}
  UNROLL: {kind: int, values: [1, 2, 4], doc: inner nnz unroll factor}
  USE_RESTRICT: {kind: int, values: [0, 1], doc: restrict-qualify operands}
  PRAGMA_VECTORIZE: {kind: int, values: [0, 1], doc: request vectorisation of the gather loop}
default: {ACCUMULATORS: 1, UNROLL: 2, USE_RESTRICT: 1, PRAGMA_VECTORIZE: 0}
flops: "2*M*NNZ"
bytes: "4*(M+1) + 8*M*NNZ + 4*N + 4*M"
rtol: 0.002
atol: 0.002
output: {shape: [M], dtype: float32}
notes:
  inputs: [rowptr.bin, cols.bin, vals.bin, x.bin]
  output: out.bin
