name: reduce_sum
description: Row-wise sum reduction of a dense float32 matrix.
character: memory-bound
kernel: kernel.cpp
shapes:
  small: {M: 1024, N: 1024}
  large: {M: 2048, N: 16384}
knobs:
  UNROLL: {kind: int, values: [1, 2, 4, 8], doc: row-loop unroll factor}
  ACCUMULATORS: {kind: int, values: [1, 2, 4], doc: independent partial sums}
  USE_RESTRICT: {kind: int, values: [0, 1], doc: restrict-qualify operands}
  PRAGMA_VECTORIZE: {kind: int, values: [0, 1], doc: request vectorisation}
default: {UNROLL: 4, ACCUMULATORS: 1, USE_RESTRICT: 1, PRAGMA_VECTORIZE: 0}
flops: "M*N"
bytes: "4*(M*N + M)"
rtol: 0.002
atol: 0.01
output: {shape: [M], dtype: float32}
notes:
  inputs: [x.bin]
  output: out.bin
